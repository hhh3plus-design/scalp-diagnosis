<style>
#scalp-diag * { box-sizing: border-box; margin: 0; padding: 0; }
#scalp-diag { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; max-width: 640px; margin: 0 auto; padding: 2rem 1rem; color: #333; }
#scalp-diag .sd-header { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid #e8e8e8; }
#scalp-diag .sd-logo { font-size: 12px; color: #999; letter-spacing: 0.1em; margin-bottom: 8px; }
#scalp-diag .sd-title { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
#scalp-diag .sd-subtitle { font-size: 14px; color: #666; line-height: 1.6; }
#scalp-diag .sd-progress-bar { background: #f0f0f0; border-radius: 99px; height: 5px; margin-bottom: 6px; overflow: hidden; }
#scalp-diag .sd-progress-fill { height: 100%; border-radius: 99px; background: #1D9E75; transition: width 0.4s ease; }
#scalp-diag .sd-progress-label { font-size: 12px; color: #999; text-align: right; margin-bottom: 1.5rem; }
#scalp-diag .sd-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
#scalp-diag .sd-q-num { font-size: 11px; color: #999; letter-spacing: 0.1em; margin-bottom: 8px; }
#scalp-diag .sd-q-text { font-size: 17px; font-weight: 600; color: #1a1a1a; line-height: 1.5; margin-bottom: 1.25rem; }
#scalp-diag .sd-options { display: flex; flex-direction: column; gap: 8px; }
#scalp-diag .sd-opt { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #fff; color: #333; font-size: 15px; text-align: left; width: 100%; transition: all 0.15s; }
#scalp-diag .sd-opt:hover { background: #f5f5f5; border-color: #bbb; }
#scalp-diag .sd-opt.selected { border-color: #1D9E75; background: #E1F5EE; color: #085041; }
#scalp-diag .sd-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #ccc; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
#scalp-diag .sd-opt.selected .sd-dot { background: #1D9E75; border-color: #1D9E75; }
#scalp-diag .sd-opt.selected .sd-dot::after { content: ''; width: 6px; height: 6px; background: white; border-radius: 50%; display: block; }
#scalp-diag .sd-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
#scalp-diag .sd-btn { padding: 11px 28px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #333; transition: all 0.15s; }
#scalp-diag .sd-btn:hover { background: #f5f5f5; }
#scalp-diag .sd-btn-primary { background: #1D9E75; border-color: #1D9E75; color: white; }
#scalp-diag .sd-btn-primary:hover { background: #0F6E56; }
#scalp-diag .sd-btn:disabled { opacity: 0.35; cursor: not-allowed; }
#scalp-diag .sd-result { display: none; }
#scalp-diag .sd-result-badge { display: inline-flex; align-items: center; padding: 5px 18px; border-radius: 99px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
#scalp-diag .sd-result-type { font-size: 26px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; }
#scalp-diag .sd-result-desc { font-size: 15px; color: #555; line-height: 1.8; margin-bottom: 1.5rem; }
#scalp-diag .sd-section-title { font-size: 12px; font-weight: 600; color: #999; letter-spacing: 0.08em; margin-bottom: 10px; }
#scalp-diag .sd-tags { display: flex; flex-wrap: wrap; gap: 6px; }
#scalp-diag .sd-tag { padding: 5px 14px; border-radius: 99px; font-size: 13px; border: 1px solid #e0e0e0; color: #555; background: #fafafa; }
#scalp-diag .sd-tag-green { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
#scalp-diag .sd-bar-wrap { margin-bottom: 10px; }
#scalp-diag .sd-bar-label { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 4px; }
#scalp-diag .sd-bar-bg { background: #f0f0f0; border-radius: 99px; height: 7px; overflow: hidden; }
#scalp-diag .sd-bar-fill { height: 100%; border-radius: 99px; transition: width 0.9s ease; }
#scalp-diag .sd-cta { background: #f7f7f7; border-radius: 12px; padding: 1.5rem; text-align: center; margin-top: 1.5rem; border: 1px solid #e8e8e8; }
#scalp-diag .sd-cta-title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
#scalp-diag .sd-cta-sub { font-size: 13px; color: #666; margin-bottom: 1.2rem; line-height: 1.6; }
#scalp-diag .sd-cta-btn { display: inline-block; padding: 13px 32px; background: #1D9E75; color: white; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; transition: background 0.2s; }
#scalp-diag .sd-cta-btn:hover { background: #0F6E56; color: white; text-decoration: none; }
#scalp-diag .sd-restart { text-align: center; margin-top: 1.5rem; }
</style>

<div id="scalp-diag">
  <div class="sd-header">
    <div class="sd-logo">H3+ Luce — 頭皮診断</div>
    <div class="sd-title">あなたの頭皮タイプを知ろう</div>
    <div class="sd-subtitle">12の質問に答えるだけで、頭皮の状態と<br>あなたに合ったケア方法がわかります</div>
  </div>

  <div id="sd-quiz">
    <div class="sd-progress-bar"><div class="sd-progress-fill" id="sd-prog" style="width:8%"></div></div>
    <div class="sd-progress-label" id="sd-prog-label">1 / 12</div>
    <div class="sd-card">
      <div class="sd-q-num" id="sd-q-num">質問 1</div>
      <div class="sd-q-text" id="sd-q-text"></div>
      <div class="sd-options" id="sd-options"></div>
    </div>
    <div class="sd-nav">
      <button class="sd-btn" id="sd-back" onclick="sdBack()" disabled>← 戻る</button>
      <button class="sd-btn sd-btn-primary" id="sd-next" onclick="sdNext()" disabled>次へ →</button>
    </div>
  </div>

  <div class="sd-result" id="sd-result">
    <div style="text-align:center; padding: 1rem 0 0.5rem;">
      <div class="sd-result-badge" id="sd-badge"></div>
      <div class="sd-result-type" id="sd-rtype"></div>
      <div class="sd-result-desc" id="sd-rdesc"></div>
    </div>
    <div class="sd-card" style="margin-bottom:1rem;">
      <div class="sd-section-title">頭皮スコア</div>
      <div id="sd-bars"></div>
    </div>
    <div class="sd-card" style="margin-bottom:1rem;">
      <div class="sd-section-title">気になる症状</div>
      <div class="sd-tags" id="sd-symptoms"></div>
    </div>
    <div class="sd-card" style="margin-bottom:1rem;">
      <div class="sd-section-title">おすすめのケア</div>
      <div class="sd-tags" id="sd-care"></div>
    </div>
    <div class="sd-cta">
      <div class="sd-cta-title">専門家によるカウンセリングを受けませんか？</div>
      <div class="sd-cta-sub">H3+ Luceでは量子波動解析器サードアイを使った<br>頭皮・薄毛の根本改善をサポートしています</div>
      <a href="https://h3-plus.com/consultation/" class="sd-cta-btn">無料相談・ご予約はこちら →</a>
    </div>
    <div class="sd-restart">
      <button class="sd-btn" onclick="sdRestart()">もう一度診断する</button>
    </div>
  </div>
</div>

<script>
(function(){
var questions = [
  { text: "頭皮を触ったとき、どのような感触がありますか？", options: ["乾燥してカサカサしている","しっとり、ちょうどよい","ベタつきを感じる","場所によって違う（部分的にベタつく）"] },
  { text: "洗髪後、どのくらいで頭皮がベタついてきますか？", options: ["2日以上ベタつかない","翌日にはベタつく","当日の夕方にはベタつく","半日もしないうちにベタつく"] },
  { text: "フケはどのようなタイプですか？", options: ["白くて乾燥した細かいフケ","大きく脂っぽいフケ","季節によって変わる","ほとんど出ない"] },
  { text: "頭皮のかゆみはありますか？", options: ["ほぼない","洗髪後にたまにある","乾燥すると強くなる","常にかゆみを感じる"] },
  { text: "1日の抜け毛の量はどのくらいですか？", options: ["50本未満（少ない）","50〜100本（普通）","100〜150本（やや多い）","150本以上（かなり多い）"] },
  { text: "頭皮に赤みや炎症を感じることがありますか？", options: ["まったくない","たまにある","よくある","慢性的にある"] },
  { text: "シャンプーは1日に何回しますか？", options: ["1日おき〜2日に1回","1日1回","1日2回以上","週に数回"] },
  { text: "ストレスを感じる頻度はどのくらいですか？", options: ["あまり感じない","月に数回感じる","週に数回感じる","ほぼ毎日感じる"] },
  { text: "睡眠の質はいかがですか？", options: ["ぐっすり眠れている","まあまあ眠れている","途中で目が覚めることが多い","慢性的に睡眠不足"] },
  { text: "食生活について当てはまるものを選んでください", options: ["バランスよく食事できている","野菜・たんぱく質が少ない","脂っぽいものを多く食べる","不規則で食事量が少ない"] },
  { text: "頭皮の血行についてはどう感じますか？", options: ["頭皮が柔らかくマッサージが気持ちいい","普通","頭皮が硬く張っている感じ","頭痛や肩こりをよく感じる"] },
  { text: "これまでに頭皮・髪のトラブルで一番気になったことは何ですか？", options: ["フケ・かゆみ","薄毛・抜け毛","白髪の増加","ハリ・コシの低下"] }
];

var types = {
  dry: {
    label: "乾燥型", color: "#1D9E75", bgColor: "#E1F5EE", textColor: "#085041",
    desc: "頭皮の皮脂分泌が少なく、水分不足の状態です。乾燥フケや頭皮のかゆみが起きやすく、刺激に敏感になっています。保湿ケアと頭皮環境の根本改善が大切です。",
    symptoms: ["乾燥フケ","頭皮のかゆみ","ハリ・コシ不足","毛先の乾燥"],
    care: ["保湿シャンプー","バイオスパ","頭皮マッサージ","インナーケア（水分・ビタミン）"],
    barColor: "#1D9E75"
  },
  oily: {
    label: "脂性型", color: "#BA7517", bgColor: "#FAEEDA", textColor: "#412402",
    desc: "皮脂分泌が過剰で、毛穴が詰まりやすい状態です。べたつき・脂性フケ・抜け毛の原因にもなります。洗浄ケアと皮脂バランスの調整が重要です。",
    symptoms: ["脂性フケ","頭皮のベタつき","毛穴詰まり","抜け毛の増加"],
    care: ["スカルプシャンプー","サードアイ測定","食生活改善","波動スパ"],
    barColor: "#EF9F27"
  },
  sensitive: {
    label: "敏感型", color: "#993556", bgColor: "#FBEAF0", textColor: "#4B1528",
    desc: "頭皮のバリア機能が低下し、外的刺激に敏感になっています。炎症・赤み・かゆみが出やすく、ストレスや生活習慣の影響を受けやすいタイプです。",
    symptoms: ["頭皮の赤み・炎症","強いかゆみ","ヒリヒリ感","季節の変わり目に悪化"],
    care: ["低刺激シャンプー","バイオスパ","ストレスケア","サードアイ根本診断"],
    barColor: "#D4537E"
  },
  mixed: {
    label: "混合型", color: "#534AB7", bgColor: "#EEEDFE", textColor: "#26215C",
    desc: "Tゾーンはべたつき、サイドは乾燥するなど、頭皮の部位によって状態が異なります。バランスを整えるトータルケアが必要なタイプです。",
    symptoms: ["部分的なベタつき","乾燥とオイリーが混在","不安定なフケ","疲労時に悪化"],
    care: ["バランスシャンプー","カウンセリング","サードアイ測定","生活習慣改善"],
    barColor: "#7F77DD"
  },
  thinning: {
    label: "薄毛リスク型", color: "#993C1D", bgColor: "#FAECE7", textColor: "#4A1B0C",
    desc: "抜け毛が多く、血行不良やストレス・栄養不足が複合的に影響しているタイプです。早めの根本改善ケアで、発毛・育毛環境を整えることが大切です。",
    symptoms: ["抜け毛が多い","頭皮の硬さ","血行不良","栄養・睡眠不足"],
    care: ["バイオスパ（発毛促進）","量子波動サードアイ","インナーケア","頭皮血行マッサージ"],
    barColor: "#D85A30"
  }
};

var barLabels = { dry:"乾燥度", oily:"脂性度", sensitive:"敏感度", mixed:"混合度", thinning:"薄毛リスク" };
var current = 0;
var answers = new Array(questions.length).fill(null);

function render() {
  var q = questions[current];
  document.getElementById('sd-q-num').textContent = '質問 ' + (current+1);
  document.getElementById('sd-q-text').textContent = q.text;
  document.getElementById('sd-prog-label').textContent = (current+1) + ' / ' + questions.length;
  document.getElementById('sd-prog').style.width = (((current+1)/questions.length)*100) + '%';
  var opts = document.getElementById('sd-options');
  opts.innerHTML = '';
  q.options.forEach(function(o, i) {
    var btn = document.createElement('button');
    btn.className = 'sd-opt' + (answers[current]===i?' selected':'');
    btn.innerHTML = '<span class="sd-dot"></span><span>' + o + '</span>';
    btn.onclick = function(){ answers[current]=i; render(); };
    opts.appendChild(btn);
  });
  document.getElementById('sd-back').disabled = current===0;
  var isLast = current===questions.length-1;
  var next = document.getElementById('sd-next');
  next.textContent = isLast ? '結果を見る ✓' : '次へ →';
  next.disabled = answers[current]===null;
}

function sdNext() {
  if(answers[current]===null) return;
  if(current<questions.length-1){ current++; render(); }
  else showResult();
}
window.sdNext = sdNext;

function sdBack() { if(current>0){ current--; render(); } }
window.sdBack = sdBack;

function showResult() {
  var a = answers;
  var scores = {
    dry:      (a[0]===0?3:0)+(a[2]===0?3:0)+(a[3]===2?2:0)+(a[3]===0?1:0),
    oily:     (a[0]===2?3:0)+(a[1]===3?3:0)+(a[2]===1?3:0)+(a[6]===2?2:0),
    sensitive:(a[3]===3?3:0)+(a[5]===2||a[5]===3?3:0)+(a[7]===3?2:0),
    mixed:    (a[0]===3?3:0)+(a[2]===2?2:0)+(a[1]===1?2:0),
    thinning: (a[4]===2||a[4]===3?3:0)+(a[7]===3?2:0)+(a[8]===2||a[8]===3?2:0)+(a[10]===2||a[10]===3?2:0)
  };
  var maxKey = Object.keys(scores).reduce(function(a,b){ return scores[a]>=scores[b]?a:b; });
  var t = types[maxKey];
  document.getElementById('sd-quiz').style.display='none';
  document.getElementById('sd-result').style.display='block';

  var badge = document.getElementById('sd-badge');
  badge.textContent = '診断結果：' + t.label;
  badge.style.background = t.bgColor;
  badge.style.color = t.textColor;
  badge.style.border = '1px solid ' + t.color;

  document.getElementById('sd-rtype').textContent = t.label + ' 頭皮';
  document.getElementById('sd-rdesc').textContent = t.desc;

  var maxVal = Object.values(scores).reduce(function(a,b){ return a<b?b:a; }, 0) || 1;
  var sorted = Object.entries(scores).sort(function(a,b){ return b[1]-a[1]; });
  document.getElementById('sd-bars').innerHTML = sorted.map(function(entry){
    var k=entry[0], v=entry[1];
    var pct = Math.round((v/maxVal)*100);
    var color = types[k].barColor;
    return '<div class="sd-bar-wrap"><div class="sd-bar-label"><span>'+barLabels[k]+'</span><span>'+pct+'%</span></div><div class="sd-bar-bg"><div class="sd-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
  }).join('');

  document.getElementById('sd-symptoms').innerHTML = t.symptoms.map(function(s){ return '<span class="sd-tag">'+s+'</span>'; }).join('');
  document.getElementById('sd-care').innerHTML = t.care.map(function(c){ return '<span class="sd-tag sd-tag-green">'+c+'</span>'; }).join('');
}

function sdRestart() {
  current=0; answers=new Array(questions.length).fill(null);
  document.getElementById('sd-result').style.display='none';
  document.getElementById('sd-quiz').style.display='block';
  render();
}
window.sdRestart = sdRestart;

render();
})();
</script>
